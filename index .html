<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3a2f8f"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap"><title>خالد أونلاين – المبيعات والفواتير</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--g:#3a2f8f;--g2:#ecebf8;--bg:#f4f6f5;--card:#fff;--tx:#1b2621;--mu:#6b7a73;--bd:#dde5e1;--rd:#c0392b}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--g:#8fa8f0;--g2:#22254a;--bg:#111815;--card:#1a231f;--tx:#e8f0ec;--mu:#95a59d;--bd:#2a3731;--rd:#e5675a}}
:root[data-theme="dark"]{--g:#8fa8f0;--g2:#22254a;--bg:#111815;--card:#1a231f;--tx:#e8f0ec;--mu:#95a59d;--bd:#2a3731;--rd:#e5675a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,Arial,sans-serif;padding-bottom:70px}
header{background:#3a2f8f;color:#fff;padding:10px 16px;display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px}
header svg{width:30px;height:30px}
main{max-width:900px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:12px}
input,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
button{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:var(--g);color:#fff;cursor:pointer;font-weight:600}
button.s{background:var(--g2);color:var(--g)} button.d{background:transparent;color:var(--rd);padding:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.p{background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:10px;cursor:pointer;text-align:start}
.p b{display:block}.p small{color:var(--mu)}
.row{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border:0}
.f{display:grid;grid-template-columns:1fr 1fr;gap:8px}.f .w{grid-column:1/-1}
.st{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.st div{background:var(--g2);border-radius:12px;padding:12px}.st span{display:block;color:var(--mu);font-size:13px}.st b{font-size:20px;color:var(--g)}
nav{position:fixed;bottom:0;inset-inline:0;background:var(--card);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;white-space:nowrap;background:none;color:var(--mu);border-radius:0;padding:12px 4px;font-size:12px}
nav button.on{color:var(--g);border-top:3px solid var(--g)}
.low{color:var(--rd);font-size:12px}.qty{display:flex;gap:6px;align-items:center}.qty button{padding:2px 10px}
.tot{font-size:18px;font-weight:700;display:flex;justify-content:space-between;margin:8px 0}
.empty{color:var(--mu);text-align:center;padding:16px}
.h{overflow-x:auto}
.inv{background:#fff;color:#111;border:1px solid var(--bd);border-radius:14px;padding:16px}
.inv table{width:100%;border-collapse:collapse;margin:10px 0}.inv th,.inv td{padding:6px;border-bottom:1px solid #ddd;text-align:start;font-size:14px}
.inv h2{margin:0;color:#3a2f8f}.inv .r{display:flex;justify-content:space-between;padding:3px 0}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.acts a,.acts button{flex:1;min-width:110px;text-align:center;text-decoration:none;border-radius:10px;padding:10px;font-weight:600}
.acts a{background:#25d366;color:#fff}
@media print{header,nav,.acts{display:none!important}body{background:#fff;padding:0}.inv{border:0}}

:root{--bg:#f3f4fb;--sh:0 2px 10px rgba(40,30,120,.08)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1220;--card:#181c30;--bd:#262b45;--sh:none}}
body{font-family:Cairo,"Segoe UI",Tahoma,Arial,sans-serif;padding-bottom:84px}
header{background:linear-gradient(135deg,#2c2273,#4f5fd0)!important;padding:12px 16px!important;border-radius:0 0 22px 22px;box-shadow:0 4px 16px rgba(44,34,115,.25);position:sticky;top:0;z-index:5}
header small{display:block;font-weight:400;font-size:12px;opacity:.85;line-height:1.2}
header div{line-height:1.25}
.card{box-shadow:var(--sh);border-radius:16px;padding:14px;border:1px solid var(--bd)}
.card>b:first-child{display:block;margin-bottom:8px;font-size:16px}
button{background:linear-gradient(135deg,#3a2f8f,#4f5fd0);border-radius:12px;padding:11px 16px}
button.s{background:var(--g2);color:var(--g)}
input,select{border-radius:12px;padding:11px}
.p{display:flex;gap:10px;align-items:center;box-shadow:var(--sh);background:var(--card);transition:.15s}
.p:active{transform:scale(.97)}
.av{flex:none;width:38px;height:38px;border-radius:12px;background:var(--g2);color:var(--g);display:grid;place-items:center;font-weight:700;font-size:18px}
.grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
nav{box-shadow:0 -4px 18px rgba(40,30,120,.12);border-radius:20px 20px 0 0;border:0}
nav button{background:none!important;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;padding:9px 2px;border-top:0!important;color:var(--mu)}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--g);font-weight:700}
nav button.on svg{background:var(--g2);border-radius:10px;padding:3px;width:32px;height:26px}
.hero{background:linear-gradient(135deg,#2c2273,#4f7fe0);color:#fff;border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:0 6px 20px rgba(58,47,143,.3)}
.hero h3{margin:2px 0 12px;font-size:20px}.hs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hs div{background:rgba(255,255,255,.16);border-radius:14px;padding:10px}.hs span{display:block;font-size:12px;opacity:.85}.hs b{font-size:15px}
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.qa button{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--card);color:var(--g);box-shadow:var(--sh);border:1px solid var(--bd);font-size:13px}
.qa svg{width:26px;height:26px}
.badge{background:#fdecea;color:#c0392b;border-radius:8px;padding:2px 8px;font-size:12px}
nav button{font-size:10px!important;padding:8px 0!important}nav button svg{width:20px;height:20px}nav button.on svg{width:28px!important;height:24px!important}
.st div{border-radius:14px}.row{padding:10px 0}
.tabs{display:flex;gap:6px;margin-bottom:8px}.tabs button{flex:1;background:var(--g2);color:var(--g);padding:9px 4px}.tabs button.on{background:linear-gradient(135deg,#3a2f8f,#4f5fd0);color:#fff}
.ri{display:inline-flex}.ri svg{width:22px;height:22px}.sb{display:flex;align-items:center;justify-content:center;gap:8px}
.badge{display:inline-block}.st div{min-width:0}
.neg{color:var(--rd)!important}
.hint{color:var(--mu);font-size:12.5px;margin:-2px 0 10px;line-height:1.5}
</style>
</head>

/* ---- Home ---- */
function home(){const d=new Date();d.setHours(0,0,0,0);const dx=S.exps.filter(e=>e.date>=d.getTime()).reduce((a,e)=>a+e.amt,0),ss=S.sales.filter(x=>x.date>=d.getTime()),rev=ss.reduce((a,x)=>a+x.total,0),pf=ss.reduce((a,x)=>a+x.sub-x.items.reduce((b,i)=>b+i.cost*i.q,0),0),low=S.products.filter(p=>p.qty<=5);
const cashToday=ss.filter(x=>x.paid!==false).reduce((a,x)=>a+x.total,0),colToday=S.collections.filter(x=>x.date>=d.getTime()).reduce((a,x)=>a+x.amount,0),totalDebt=allDebt();
return `<div class="hero"><small>${new Date().toLocaleDateString("ar-EG",{weekday:"long",day:"numeric",month:"long"})}</small><h3>ملخص اليوم</h3><div class="hs"><div><span>المبيعات</span><b>${m(rev)}</b></div><div><span>صافي الربح</span><b>${m(pf-dx)}</b></div><div><span>الفواتير</span><b>${ss.length}</b></div></div></div>
<div class="qa"><button onclick="go('pos')">${ic('pos')}بيع جديد</button><button onclick="go('inv')">${ic('inv')}منتج جديد</button><button onclick="go('fat')">${ic('fat')}الفواتير</button></div>
<div class="card"><b>💰 الخزنة اليوم</b><div class="row"><span>مبيعات نقدي</span><b>${m(cashToday)}</b></div>${colToday?`<div class="row"><span>تحصيل ديون قديمة</span><b>${m(colToday)}</b></div>`:""}<div class="tot"><span>إجمالي الوارد النقدي اليوم</span><span>${m(cashToday+colToday)}</span></div></div>
${totalDebt?`<div class="card" style="background:#fdecea;cursor:pointer" onclick="go('debts')"><div class="row" style="border:0"><span style="color:var(--rd);font-weight:700">💳 ديون العملاء (عليهم فلوس)</span><b style="color:var(--rd)">${m(totalDebt)}</b></div></div>`:""}
${dp?`<div class="card"><button style="width:100%" onclick="installApp()">📲 تثبيت التطبيق على الموبايل</button></div>`:""}
${old()?`<div class="card" style="background:var(--g2);cursor:pointer" onclick="go('set')">⚠️ خد نسخة احتياطية من بياناتك دلوقتي</div>`:""}
<div class="card"><b>تنبيهات المخزون</b>${low.map(p=>`<div class="row"><span>${esc(p.name)}</span><span class="badge">باقي ${p.qty}</span></div>`).join("")||'<div class="empty">المخزون تمام ✅</div>'}</div>
<div class="card"><b>آخر الفواتير</b>${S.sales.slice(0,4).map(x=>`<div class="row" style="cursor:pointer" onclick="view=${x.id};tab='fat';render()"><span>#${pad(x.no||0)} ${x.name?"· "+esc(x.name):""}</span><b>${m(x.total)}</b></div>`).join("")||'<div class="empty">لا توجد فواتير بعد</div>'}</div>`}
/* ---- Customers ---- */
function pickC(){const c=S.customers.find(x=>x.name==cn);const i=document.querySelector('input[type=tel]');if(c&&c.phone&&i&&!cp){cp=c.phone;i.value=cp}}
function waNum(p){p=nd(p);if(p.startsWith("00"))p=p.slice(2);else if(p.startsWith("0"))p="20"+p.slice(1);return p}
function cSales(c){const p=nd(c.phone);return S.sales.filter(x=>p?nd(x.phone)==p:x.name==c.name)}
function cDebt(c){return cSales(c).filter(s=>s.paid===false).reduce((a,s)=>a+s.total,0)}
function allDebt(){return S.customers.reduce((a,c)=>a+cDebt(c),0)}
function settleCustomer(id){const c=S.customers.find(x=>x.id==id);if(!c)return;
const owed=cSales(c).filter(s=>s.paid===false);if(!owed.length)return;
const amt=owed.reduce((a,s)=>a+s.total,0);
if(!confirm(`تسجيل إن ${c.name} سدد ${m(amt)}؟ هيتسجل المبلغ ده كوارد في الخزنة النهارده.`))return;
owed.forEach(s=>s.paid=true);
S.collections.unshift({id:Date.now(),date:Date.now(),name:c.name,phone:c.phone,amount:amt});
save();render()}
function settleSale(id){const s=S.sales.find(x=>x.id==id);if(!s||s.paid!==false)return;
if(!confirm(`تسجيل إن الفاتورة دي اتسددت (${m(s.total)})؟ هيتسجل المبلغ كوارد في الخزنة النهارده.`))return;
s.paid=true;S.collections.unshift({id:Date.now(),date:Date.now(),name:s.name,phone:s.phone,amount:s.total,saleId:s.id});
save();render()}
function debts(){const list=S.customers.map(c=>({c,debt:cDebt(c)})).filter(x=>x.debt>0).sort((a,b)=>b.debt-a.debt);
const total=list.reduce((a,x)=>a+x.debt,0);
return `<div class="card" style="background:#fdecea"><div class="row" style="border:0"><span style="font-weight:700;color:var(--rd)">إجمالي الديون على العملاء</span><b style="color:var(--rd);font-size:20px">${m(total)}</b></div></div>
<div class="card"><b>العملاء اللي عليهم فلوس (${list.length})</b>${list.map(({c,debt})=>`<div class="row" style="cursor:pointer" onclick="cv=${c.id};tab='cust';render();scrollTo(0,0)"><span style="display:flex;gap:10px;align-items:center"><span class="av">${esc(c.name[0]||"•")}</span><span>${esc(c.name)}<br><small style="color:var(--mu)">${esc(c.phone||"بدون رقم")}</small></span></span><b style="color:var(--rd)">${m(debt)}</b></div>`).join("")||'<div class="empty">مفيش عملاء عليهم فلوس دلوقتي ✅</div>'}</div>`}
function cust(){
if(cv){const c=S.customers.find(x=>x.id==cv);if(c)return custView(c)}
const e=ce||{};
const l=S.customers.filter(c=>!cq||c.name.includes(cq)||(nd(cq)&&nd(c.phone).includes(nd(cq))));
return `<div class="card"><b>${ce?"تعديل عميل":"إضافة عميل"}</b><div class="f"><input class="w" id="cfn" placeholder="اسم العميل" value="${esc(e.name||"")}"><input class="w" id="cfp" type="tel" placeholder="رقم الهاتف / واتساب" value="${esc(e.phone||"")}"><input class="w" id="cfa" placeholder="العنوان" value="${esc(e.addr||"")}"><input class="w" id="cfo" placeholder="ملاحظات" value="${esc(e.note||"")}"><button class="w" onclick="saveCust()">${ce?"حفظ التعديل":"إضافة العميل"}</button>${ce?'<button class="w s" onclick="ce=null;render()">إلغاء</button>':""}</div></div>
<div class="card"><input id="cs" placeholder="🔍 ابحث بالاسم أو الرقم" value="${esc(cq)}" oninput="cq=this.value;render();const i=document.getElementById('cs');i.focus();i.setSelectionRange(99,99)"></div>
<div class="card"><b>العملاء (${l.length})</b>${l.map(c=>{const a=cSales(c),t=a.reduce((z,x)=>z+x.total,0),debt=cDebt(c);return `<div class="row" style="cursor:pointer" onclick="cv=${c.id};render();scrollTo(0,0)"><span style="display:flex;gap:10px;align-items:center"><span class="av">${esc(c.name[0]||"•")}</span><span>${esc(c.name)}<br><small style="color:var(--mu)">${esc(c.phone||"بدون رقم")}</small></span></span><span style="text-align:end"><b>${m(t)}</b><br>${debt?`<span class="badge" style="background:#fdecea;color:var(--rd)">عليه ${m(debt)}</span>`:`<small style="color:var(--mu)">${a.length} فاتورة</small>`}</span></div>`}).join("")||'<div class="empty">لا يوجد عملاء بعد</div>'}</div>`}
function custView(c){const a=cSales(c),t=a.reduce((z,x)=>z+x.total,0),debt=cDebt(c);
return `<div class="card"><div style="display:flex;gap:12px;align-items:center"><span class="av" style="width:52px;height:52px;font-size:24px">${esc(c.name[0]||"•")}</span><div><b style="font-size:18px">${esc(c.name)}</b><div style="color:var(--mu)">${esc(c.phone||"بدون رقم")}</div></div></div>${c.addr?`<div class="row"><span>العنوان</span><span>${esc(c.addr)}</span></div>`:""}${c.note?`<div class="row"><span>ملاحظات</span><span>${esc(c.note)}</span></div>`:""}
<div class="st" style="margin-top:10px"><div><span>عدد الفواتير</span><b>${a.length}</b></div><div><span>إجمالي المشتريات</span><b>${m(t)}</b></div></div>
${debt?`<div class="card" style="background:#fdecea;margin-top:10px"><div class="row" style="border:0"><span style="color:var(--rd);font-weight:700">💳 عليه فلوس (آجل)</span><b style="color:var(--rd);font-size:18px">${m(debt)}</b></div><button style="width:100%;margin-top:6px" onclick="settleCustomer(${c.id})">✅ تسجيل إنه سدد (${m(debt)})</button></div>`:""}
<div class="acts">${c.phone?`<a href="https://wa.me/${waNum(c.phone)}" target="_blank" rel="noopener">واتساب</a><a href="tel:${esc(c.phone)}" style="background:var(--g);color:#fff">اتصال</a>`:""}<button class="s" onclick="ce=S.customers.find(x=>x.id==${c.id});cv=null;render();scrollTo(0,0)">تعديل</button><button class="s" onclick="delC(${c.id})">حذف</button><button class="s" onclick="cv=null;render()">رجوع</button></div></div>
<div class="card"><b>فواتير العميل</b>${a.map(x=>`<div class="row" style="cursor:pointer" onclick="view=${x.id};tab='fat';render()"><span>#${pad(x.no||0)}<br><small style="color:var(--mu)">${new Date(x.date).toLocaleString("ar-EG")}</small></span><b>${m(x.total)}</b></div>`).join("")||'<div class="empty">لا توجد فواتير</div>'}</div>`}
function saveCust(){const n=$("#cfn").value.trim(),p=$("#cfp").value.trim();if(!n){alert("اكتب اسم العميل");return}
if(!ce&&nd(p)&&findC("",p)){alert("العميل ده موجود بنفس الرقم");return}
const o={name:n,phone:p,addr:$("#cfa").value.trim(),note:$("#cfo").value.trim()};
if(ce){Object.assign(S.customers.find(c=>c.id==ce.id),o);ce=null}else S.customers.unshift({id:Date.now(),...o});save();render()}
function delC(id){if(confirm("حذف العميل؟ الفواتير القديمة هتفضل موجودة.")){S.customers=S.customers.filter(c=>c.id!=id);cv=null;save();render()}}
/* ---- POS ---- */
function pos(){
const list=S.products.filter(p=>(p.name.includes(q)||(p.code||"").includes(q)));
const sub=cart.reduce((a,c)=>a+c.price*c.q,0),tax=sub*S.cfg.tax/100;
return `${old()?`<div class="card" style="background:var(--g2);cursor:pointer" onclick="go('set')">⚠️ مفيش نسخة احتياطية حديثة لبياناتك. اضغط هنا وخد نسخة دلوقتي.</div>`:""}<div class="card"><input placeholder="🔍 ابحث عن منتج" value="${esc(q)}" oninput="q=this.value;render();document.querySelector('input').focus()">
<button class="w s sb" style="width:100%;margin-top:8px" onclick="scanPos()"><span class="ri">${ic('scan')}</span>مسح QR / باركود</button><div class="grid" style="margin-top:10px">${list.map(p=>`<div class="p" onclick="add(${p.id})"><div class="av">${esc(p.name[0]||"•")}</div><div><b>${esc(p.name)}</b><small>${m(p.price)}</small><br><small class="${p.qty<=5?"low":""}">المتاح: ${p.qty}</small></div></div>`).join("")||'<div class="empty">لا توجد منتجات</div>'}</div></div>
<div class="card"><b>السلة</b>${cart.length?cart.map(c=>`<div class="row"><span>${esc(c.name)}<br><small>${m(c.price)}</small></span><span class="qty"><button class="s" onclick="chg(${c.id},-1)">−</button>${c.q}<button class="s" onclick="chg(${c.id},1)">+</button></span></div>`).join(""):'<div class="empty">السلة فاضية</div>'}
${cart.length?`<div class="f" style="margin-top:8px"><input list="cl" placeholder="اسم العميل (اختياري)" value="${esc(cn)}" oninput="cn=this.value;pickC()"><datalist id="cl">${S.customers.map(c=>`<option value="${esc(c.name)}">`).join("")}</datalist><input type="tel" placeholder="رقم واتساب العميل" value="${esc(cp)}" oninput="cp=this.value"></div>
<div class="tabs" style="margin-top:8px"><button class="${payMode=="cash"?"on":""}" onclick="payMode='cash';render()">💵 نقدي</button><button class="${payMode=="credit"?"on":""}" onclick="payMode='credit';render()">⏳ آجل (دين)</button></div>
${payMode=="credit"?`<p class="hint">البيع الآجل محتاج اسم العميل أو رقمه عشان الدين يتسجل عليه ويظهر في قسم "ديون العملاء".</p>`:""}
<div class="row"><span>المجموع</span><span>${m(sub)}</span></div>${S.cfg.tax?`<div class="row"><span>ضريبة ${S.cfg.tax}%</span><span>${m(tax)}</span></div>`:""}<div class="tot"><span>الإجمالي</span><span>${m(sub+tax)}</span></div><button style="width:100%" onclick="pay()">${payMode=="credit"?"تسجيل بيع آجل وإصدار فاتورة":"إتمام البيع (نقدي) وإصدار فاتورة"}</button>`:""}</div>`}
function add(id){const p=S.products.find(x=>x.id==id),c=cart.find(x=>x.id==id);
if((c?c.q:0)>=p.qty){alert("الكمية المتاحة غير كافية");return}
c?c.q++:cart.push({id:p.id,name:p.name,price:p.price,cost:p.cost,q:1});render()}
function chg(id,d){const c=cart.find(x=>x.id==id),p=S.products.find(x=>x.id==id);
if(d>0&&c.q>=p.qty)return;c.q+=d;if(c.q<=0)cart=cart.filter(x=>x.id!=id);render()}
function pay(){const sub=cart.reduce((a,c)=>a+c.price*c.q,0),tax=sub*S.cfg.tax/100;
if(payMode=="credit"&&!cn.trim()&&!cp.trim()){alert("البيع الآجل محتاج اسم العميل أو رقمه");return}
cart.forEach(c=>{S.products.find(p=>p.id==c.id).qty-=c.q});
ensureC(cn,cp);const sale={id:Date.now(),no:++S.seq,date:Date.now(),items:cart,sub,tax,total:sub+tax,name:cn.trim(),phone:cp.trim(),paid:payMode!=="credit"};
S.sales.unshift(sale);cart=[];cn="";cp="";payMode="cash";save();tab="fat";view=sale.id;render();scrollTo(0,0)}
/* ---- Inventory ---- */
function inv(){const e=edit||{};
return `<div class="card"><b>${edit?"تعديل منتج":"إضافة منتج"}</b><div class="f" style="margin-top:8px">
<input class="w" id="n" placeholder="اسم المنتج" value="${esc(e.name||"")}">
<input id="pr" type="number" placeholder="سعر البيع" value="${e.price??""}">
<input id="co" type="number" placeholder="سعر التكلفة" value="${e.cost??""}">
<input class="w" id="qt" type="number" placeholder="الكمية" value="${e.qty??""}"><input class="w" id="cd" placeholder="الباركود / QR (اختياري)" value="${esc(e.code||"")}"><button class="w s sb" onclick="scan(t=>{$('#cd').value=t})"><span class="ri">${ic('scan')}</span>مسح الكود</button>
<button class="w" onclick="saveP()">${edit?"حفظ التعديل":"إضافة"}</button>${edit?'<button class="w s" onclick="edit=null;render()">إلغاء</button>':""}</div></div>
<div class="card"><b>المنتجات (${S.products.length})</b>${S.products.map(p=>`<div class="row"><span>${esc(p.name)}<br><small>بيع ${m(p.price)} · تكلفة ${m(p.cost)}${p.code?" · "+esc(p.code):""}</small></span><span><b class="${p.qty<=5?"low":""}">${p.qty}${p.qty<=5?" ⚠️":""}</b> <button class="s" onclick="ed(${p.id})">تعديل</button><button class="d" onclick="del(${p.id})">حذف</button></span></div>`).join("")||'<div class="empty">أضف أول منتج</div>'}</div>`}
function saveP(){const n=$("#n").value.trim(),pr=+$("#pr").value,co=+$("#co").value||0,qt=+$("#qt").value||0,cd=$("#cd").value.trim();
if(!n||!pr){alert("اكتب الاسم وسعر البيع");return}
if(edit){Object.assign(S.products.find(p=>p.id==edit.id),{name:n,price:pr,cost:co,qty:qt,code:cd});edit=null}
else S.products.push({id:Date.now(),name:n,price:pr,cost:co,qty:qt,code:cd});save();render()}
function ed(id){edit=S.products.find(p=>p.id==id);render();scrollTo(0,0)}
function del(id){if(confirm("حذف المنتج؟")){S.products=S.products.filter(p=>p.id!=id);cart=cart.filter(c=>c.id!=id);save();render()}}
/* ---- Invoices ---- */
const pad=n=>String(n).padStart(4,"0");
function fat(){
if(view){const s=S.sales.find(x=>x.id==view);if(s)return invView(s)}
const l=S.sales.filter(s=>!iq||(s.name||"").includes(iq)||String(s.no).includes(iq)||(s.phone||"").includes(iq));
return `<div class="card"><input placeholder="🔍 ابحث برقم الفاتورة أو اسم/رقم العميل" value="${esc(iq)}" oninput="iq=this.value;render();const i=document.querySelector('input');i.focus();i.setSelectionRange(99,99)"></div>
<div class="card"><b>الفواتير (${l.length})</b>${l.map(s=>`<div class="row" style="cursor:pointer" onclick="view=${s.id};render();scrollTo(0,0)"><span>فاتورة #${pad(s.no||0)} ${s.name?"· "+esc(s.name):""}<br><small>${new Date(s.date).toLocaleString("ar-EG")}</small></span><span style="text-align:end"><b>${m(s.total)}</b>${s.paid===false?'<br><span class="badge" style="background:#fdecea;color:var(--rd)">آجل</span>':""}</span></div>`).join("")||'<div class="empty">لا توجد فواتير بعد</div>'}</div>`}
function invText(s){const c=S.cfg;
return `*خالد أونلاين*\n${c.addr?c.addr+"\n":""}${c.phone?"📞 "+c.phone+"\n":""}—————————\nفاتورة رقم: ${pad(s.no||0)}\nالتاريخ: ${new Date(s.date).toLocaleString("ar-EG")}\n${s.name?"العميل: "+s.name+"\n":""}—————————\n${s.items.map(i=>`${i.name} × ${i.q} = ${m(i.price*i.q)}`).join("\n")}\n—————————\nالمجموع: ${m(s.sub)}\n${s.tax?"الضريبة: "+m(s.tax)+"\n":""}*الإجمالي: ${m(s.total)}*\n${s.paid===false?"⏳ *آجل - غير مدفوعة بعد*\n":""}\n${c.note||""}`}

async function invImg(id){const el=document.getElementById("invCard"),b=document.getElementById("busy"+id);

try{const im=el.querySelector("img");if(im&&im.decode)try{await im.decode()}catch(e){}
const cv=await html2canvas(el,{scale:2,backgroundColor:"#ffffff",useCORS:true,scrollX:0,scrollY:-window.scrollY,windowWidth:document.documentElement.clientWidth,ignoreElements:e=>e.classList&&(e.classList.contains("acts")||(e.id||"").startsWith("busy"))});
return await new Promise(res=>cv.toBlob(res,"image/png"));}finally{b.style.display="none"}}
async function shareImg(id,wa){const s=S.sales.find(x=>x.id==id);
const blob=await invImg(id);if(!blob){alert("تعذر إنشاء الصورة");return}
const file=new File([blob],"فاتورة-"+pad(s.no||0)+".png",{type:"image/png"});
if(navigator.canShare&&navigator.canShare({files:[file]})){
try{await navigator.share({files:[file],title:"فاتورة "+pad(s.no||0)});return}catch(e){if(e&&e.name=="AbortError")return}}

/* QR / barcode scanner */
async function scan(cb){const ov=document.createElement("div");ov.style.cssText="position:fixed;inset:0;background:#000;z-index:99;display:flex;flex-direction:column";
ov.innerHTML='<video playsinline muted style="flex:1;min-height:0;object-fit:cover;width:100%"></video><div style="color:#fff;text-align:center;padding:10px">وجّه الكاميرا على الـ QR أو الباركود</div><button style="margin:0 12px 14px">إغلاق</button>';
document.body.appendChild(ov);const v=ov.querySelector("video");let on=true,st=null;
const end=()=>{on=false;st&&st.getTracks().forEach(t=>t.stop());ov.remove()};ov.querySelector("button").onclick=end;
try{st=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});v.srcObject=st;await v.play()}catch(e){end();const t=prompt("تعذر فتح الكاميرا. اكتب الكود يدويًا:");if(t)cb(t.trim());return}
let det=null;if("BarcodeDetector" in window){try{det=new BarcodeDetector()}catch(e){}}
if(!det&&!window.jsQR)await new Promise(r=>{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js";s.onload=s.onerror=r;document.head.appendChild(s)});
const cn=document.createElement("canvas"),cx=cn.getContext("2d",{willReadFrequently:true});
const tick=async()=>{if(!on)return;try{let r=null;
if(det){const a=await det.detect(v);if(a.length)r=a[0].rawValue}
else if(window.jsQR&&v.videoWidth){cn.width=v.videoWidth;cn.height=v.videoHeight;cx.drawImage(v,0,0);const d=cx.getImageData(0,0,cn.width,cn.height),q=jsQR(d.data,d.width,d.height);if(q)r=q.data}
if(r){end();cb(String(r).trim());return}}catch(e){}setTimeout(tick,200)};tick()}

function delExp(id){if(confirm("حذف المصروف؟")){S.exps=S.exps.filter(e=>e.id!=id);save();render()}}
function exp(){const p=pnl(rfrom("month"));
return `<div class="card"><b>تسجيل مصروف / سحب</b><div class="f" style="margin-top:8px"><input id="ea" type="number" inputmode="decimal" placeholder="المبلغ"><select id="ec">${EC.map(c=>`<option>${c}</option>`).join("")}</select><input class="w" id="en" placeholder="ملاحظة (اختياري)"><button class="w" onclick="addExp()">تسجيل وخصم من الربح</button></div></div>
<div class="card st"><div><span>ربح الشهر</span><b>${m(p.gp)}</b></div><div><span>مصروفات الشهر</span><b>${m(p.exT)}</b></div><div style="grid-column:1/-1"><span>صافي الربح بعد المصروفات (هذا الشهر)</span>${mN(p.net)}</div></div>
<div class="card"><b>سجل المصروفات</b>${S.exps.slice(0,60).map(e=>`<div class="row"><span>${esc(e.cat)}${e.note?" · "+esc(e.note):""}<br><small>${dt(e.date)}</small></span><span><b>${m(e.amt)}</b><button class="d" onclick="delExp(${e.id})">✕</button></span></div>`).join("")||'<div class="empty">لا توجد مصروفات</div>'}</div>`}
/* Reports */
function rep(){const tb=[["sales","المبيعات"],["stock","المخزن"],["bud","الميزانية"]];
return `<div class="card"><div class="tabs">${tb.map(([k,l])=>`<button class="${k==rt?"on":""}" onclick="rt='${k}';render()">${l}</button>`).join("")}</div>${rt!="stock"?`<select onchange="rng=this.value;render()">${RO.map(([k,l])=>`<option value="${k}" ${k==rng?"selected":""}>${l}</option>`).join("")}</select>`:""}</div>`+(rt=="stock"?repStock():rt=="bud"?repBud():repSales())}
function repSales(){const p=pnl(rfrom(rng)),ss=p.ss,top={};ss.forEach(s=>s.items.forEach(i=>top[i.name]=(top[i.name]||0)+i.q));const tp=Object.entries(top).sort((a,b)=>b[1]-a[1]).slice(0,5);
return `<div class="card st"><div><span>الإيرادات</span><b>${m(p.rev)}</b></div><div><span>تكلفة البضاعة</span><b>${m(p.cogs)}</b></div><div><span>إجمالي الربح</span><b>${m(p.gp)}</b></div><div><span>المصروفات</span><b>${m(p.exT)}</b></div><div style="grid-column:1/-1"><span>صافي الربح بعد المصروفات</span>${mN(p.net)}</div><div><span>هامش الصافي</span><b class="${p.net<0?"neg":""}">${p.rev?Math.round(p.net/p.rev*100):0}%</b></div><div><span>عدد الفواتير</span><b>${ss.length}</b></div></div>
<div class="card"><b>الأكثر مبيعًا</b>${tp.map(([n,q])=>`<div class="row"><span>${esc(n)}</span><b>${q}</b></div>`).join("")||'<div class="empty">لا توجد مبيعات</div>'}</div>
<div class="card"><b>فواتير الفترة</b>${ss.slice(0,20).map(s=>`<div class="row" style="cursor:pointer" onclick="view=${s.id};tab='fat';render()"><span>#${pad(s.no||0)} · ${dt(s.date)}<br><small>${s.items.map(i=>esc(i.name)+"×"+i.q).join("، ")}</small></span><b>${m(s.total)}</b></div>`).join("")||'<div class="empty">لا توجد فواتير</div>'}${p.tx?`<small>إجمالي الضريبة: ${m(p.tx)}</small>`:""}</div>`}
function repStock(){const P=S.products,c=P.reduce((a,p)=>a+p.cost*p.qty,0),s=P.reduce((a,p)=>a+p.price*p.qty,0),u=P.reduce((a,p)=>a+p.qty,0),low=P.filter(p=>p.qty<=5);
return `<div class="card st"><div><span>إجمالي المخزن (بسعر التكلفة)</span><b>${m(c)}</b></div><div><span>إجمالي المخزن (بسعر البيع)</span><b>${m(s)}</b></div><div style="grid-column:1/-1"><span>الربح المتوقع بعد بيع المخزن</span>${mN(s-c)}</div><div><span>نسبة الربح</span><b>${s?Math.round((s-c)/s*100):0}%</b></div><div><span>الأصناف / القطع</span><b>${P.length} / ${u}</b></div></div>
<div class="card"><b>أصناف قاربت على النفاد (${low.length})</b>${low.map(p=>`<div class="row"><span>${esc(p.name)}</span><span class="badge">باقي ${p.qty}</span></div>`).join("")||'<div class="empty">المخزون تمام ✅</div>'}</div>
<div class="card"><b>تفاصيل المخزن</b>${[...P].sort((a,b)=>b.cost*b.qty-a.cost*a.qty).map(p=>`<div class="row"><span>${esc(p.name)}<br><small>${p.qty} قطعة · تكلفة ${m(p.cost*p.qty)}</small></span><span style="text-align:end"><b>${m(p.price*p.qty)}</b><br><small>ربح ${m((p.price-p.cost)*p.qty)}</small></span></div>`).join("")||'<div class="empty">لا توجد منتجات</div>'}</div>`}
function repBud(){const f=rfrom(rng),p=pnl(f),bu=S.buys.filter(b=>b.date>=f),bt=bu.reduce((a,b)=>a+b.total,0),bp=bu.reduce((a,b)=>a+b.paid,0),due=S.buys.reduce((a,b)=>a+b.total-b.paid,0),stock=S.products.reduce((a,x)=>a+x.cost*x.qty,0),cat={};p.ex.forEach(e=>cat[e.cat]=(cat[e.cat]||0)+e.amt);
const cashSales=p.ss.filter(s=>s.paid!==false).reduce((a,s)=>a+s.total,0),creditSales=p.ss.filter(s=>s.paid===false).reduce((a,s)=>a+s.total,0),colAmt=S.collections.filter(x=>x.date>=f).reduce((a,x)=>a+x.amount,0),cashIn=cashSales+colAmt,custDebt=allDebt();
return `<div class="card"><b>الأرباح والخسائر</b><div class="row"><span>الإيرادات</span><b>${m(p.rev)}</b></div><div class="row"><span>تكلفة البضاعة المباعة</span><span>${m(p.cogs)}</span></div><div class="row"><span>إجمالي الربح</span><b>${m(p.gp)}</b></div><div class="row"><span>المصروفات</span><span>${m(p.exT)}</span></div><div class="tot"><span>صافي الربح</span>${mN(p.net)}</div></div>
<div class="card"><b>المصروفات حسب البند</b>${Object.entries(cat).map(([k,v])=>`<div class="row"><span>${esc(k)}</span><b>${m(v)}</b></div>`).join("")||'<div class="empty">لا توجد مصروفات</div>'}</div>
<div class="card"><b>المشتريات والموردين</b><div class="row"><span>مشتريات الفترة</span><span>${m(bt)}</span></div><div class="row"><span>المدفوع للموردين</span><span>${m(bp)}</span></div><div class="row"><span>مستحق للموردين (إجمالي)</span><b>${m(due)}</b></div></div>
<div class="card"><b>مبيعات نقدي وآجل (الفترة)</b><div class="row"><span>مبيعات نقدي</span><span>${m(cashSales)}</span></div><div class="row"><span>مبيعات آجلة (لسه متحصلتش)</span><span>${m(creditSales)}</span></div>${colAmt?`<div class="row"><span>تحصيل ديون قديمة في الفترة دي</span><span>${m(colAmt)}</span></div>`:""}<div class="row"><span>إجمالي الديون على العملاء (كل الفترات)</span><b class="${custDebt?"neg":""}">${m(custDebt)}</b></div></div>
<div class="card"><b>المركز المالي</b><div class="row"><span>قيمة المخزون الحالي (تكلفة)</span><b>${m(stock)}</b></div><div class="row"><span>السيولة التقديرية للفترة</span>${mN(cashIn-bp-p.exT)}</div><small style="color:var(--mu)">السيولة = (مبيعات نقدي + تحصيل ديون) − المشتريات المدفوعة − المصروفات</small></div>`}

render();
</script>
</body>
</html>
